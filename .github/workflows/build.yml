name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Crear proyecto Android y compilar APK
        run: |
          flutter create --platforms=android --org pe.pollogordo --project-name pollo_gordo app
          rm -rf app/lib app/test
          cp -r lib app/lib
          cp pubspec.yaml app/pubspec.yaml
          sed -i 's/android:label="[^"]*"/android:label="El Pollo Gordo"/' app/android/app/src/main/AndroidManifest.xml
          cd app
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: El-Pollo-Gordo-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
